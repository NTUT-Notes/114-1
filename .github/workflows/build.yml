name: Build My Notes

on:
  push:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: YFHD-osu/XOPP-Compiler@main
        with:
          publish_to_branch: true
          publish_branch: "build-output"
          custom_font_urls: "https://github.com/microsoft/cascadia-code/releases/download/v2407.24/CascadiaCode-2407.24.zip"
          github_token: ${{ secrets.GITHUB_TOKEN }}
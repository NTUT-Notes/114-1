# This is a basic workflow to help you get started with Actions

name: Convert to PDF (Shell)

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    
jobs:
  Build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Git Identity
        run: |
          git config --global user.name "XOPP Builder"
          git config --global user.email "actions@github.com"

      - name: Cache apt packages
        id: cache-apt
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: ${{ runner.os }}-apt-xournalpp-v1 # 使用一個簡單的 key
          restore-keys: |
            ${{ runner.os }}-apt-xournalpp-

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y xournalpp
      
      - name: Convert to PDF
        run: chmod +x ./.deploy/convert.sh && ./.deploy/convert.sh
      
      - name: Move output files and prepare branch
        run: |
          # Temporarily move all files outside the repo 
          mkdir -p /tmp/output_backup
          cp -r ./output/* /tmp/output_backup
          
          # 2. Delete all files excluding .git folder
          find . -mindepth 1 -not -path "./.git*" -delete
          rm -r .github
          rm .gitattributes
          rm .gitignore

          # 3. Move back all file from tmp to repo
          cp -r /tmp/output_backup/* .
          
          # 4. Final check for the file existence
          ls -la

      - name: Delete old output branch if exists
        run: |
          # 檢查 output-branch 是否存在
          if git ls-remote --heads origin output-branch | grep output-branch; then
            # 5. 刪除遠端 output-branch 分支
            git push origin --delete output-branch
          fi
        continue-on-error: true  # 如果分支不存在，允許繼續

      - name: Create and switch to output branch
        run: |
          # 6. 建立並切換到 output-branch
          git checkout --orphan output-branch
          
          # 7. 添加所有檔案到暫存區
          git add .
          
          # 8. 提交更改
          git commit -m "Update output files"
          
          # 9. 推送到 output-branch
          git push origin output-branch --force
